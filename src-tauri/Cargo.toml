[package]
name = "mantra-music-player"
version = "0.1.0"
description = "A plugin-first cross-platform desktop music player."
authors = ["Mantra Music Player contributors"]
edition = "2021"

[lib]
name = "mantra_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
